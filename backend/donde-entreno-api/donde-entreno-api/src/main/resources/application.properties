# Nombre interno de la aplicacion
spring.application.name=donde-entreno-api

# Puerto donde va a levantar el backend
server.port=${PORT:8080}

# Perfil activo por defecto para desarrollo local
spring.profiles.active=local

# ===============================
# CONFIGURACION DE JPA / HIBERNATE
# ===============================

# Le decimos a Hibernate que NO cree, modifique ni borre tablas.
# Como vos ya creaste la base con scripts SQL, esto es importante.
spring.jpa.hibernate.ddl-auto=none

# Por defecto NO se loguea el SQL; el perfil local lo activa si hace falta.
spring.jpa.show-sql=false

# Formatea las consultas SQL para que sean mas legibles en consola.
spring.jpa.properties.hibernate.format_sql=true

# Dialecto especifico para PostgreSQL.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Origenes permitidos por CORS
app.cors.allowed-origins=http://localhost:3000

# ===============================
# SUBIDA DE IMAGENES (multipart)
# ===============================

# Limite alineado con la validacion de negocio (2 MB por imagen).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ===============================
# ALMACENAMIENTO (Supabase Storage)
# ===============================

# Sin estas variables la app arranca igual: las operaciones de storage
# responden 503 con mensaje claro. Los valores reales viven en el panel
# de Render (jamas en git). La service key es secreta.
dondeentreno.storage.supabase.url=${DONDEENTRENO_STORAGE_SUPABASE_URL:}
dondeentreno.storage.supabase.service-key=${DONDEENTRENO_STORAGE_SUPABASE_SERVICE_KEY:}
dondeentreno.storage.supabase.bucket-pendientes=${DONDEENTRENO_STORAGE_SUPABASE_BUCKET_PENDIENTES:imagenes-pendientes}
dondeentreno.storage.supabase.bucket-publicas=${DONDEENTRENO_STORAGE_SUPABASE_BUCKET_PUBLICAS:imagenes-publicas}

# ===============================
# ASISTENTE
# ===============================

# Sin ninguna de estas variables el asistente funciona igual, resolviendo
# contra el catalogo real (motor local, gratis y deterministico).
dondeentreno.asistente.max-input-chars=${DONDEENTRENO_ASISTENTE_MAX_INPUT_CHARS:300}
dondeentreno.asistente.max-consultas-por-minuto=${DONDEENTRENO_ASISTENTE_MAX_CONSULTAS_POR_MINUTO:8}
dondeentreno.asistente.max-consultas-por-hora=${DONDEENTRENO_ASISTENTE_MAX_CONSULTAS_POR_HORA:60}

# Memoria de la conversacion: cuantos turnos previos se tienen en cuenta.
# No se guarda nada en la base; el historial lo manda el frontend en cada
# consulta y se pierde al cerrar la pestana.
dondeentreno.asistente.max-mensajes-historial=${DONDEENTRENO_ASISTENTE_MAX_MENSAJES_HISTORIAL:8}

# Gemini: apagado por defecto. La API key es secreta y vive UNICAMENTE en
# el panel de Render, jamas en git, en el frontend ni en los logs.
# El tope diario es la proteccion real del gasto: al agotarse, el
# asistente sigue respondiendo con el motor local.
dondeentreno.asistente.gemini-enabled=${DONDEENTRENO_ASISTENTE_GEMINI_ENABLED:false}
dondeentreno.asistente.gemini-api-key=${DONDEENTRENO_ASISTENTE_GEMINI_API_KEY:}
dondeentreno.asistente.gemini-model=${DONDEENTRENO_ASISTENTE_GEMINI_MODEL:}
dondeentreno.asistente.gemini-daily-limit=${DONDEENTRENO_ASISTENTE_GEMINI_DAILY_LIMIT:300}
